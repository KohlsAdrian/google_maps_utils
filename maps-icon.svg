<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Map pin body -->
  <path d="M100 12C67 12 40 39 40 72c0 44 53.5 105 57.3 109.2a3.5 3.5 0 0 0 5.4 0C106.5 177 160 116 160 72c0-33-27-60-60-60z" fill="#EA4335"/>

  <!-- Pin left shadow -->
