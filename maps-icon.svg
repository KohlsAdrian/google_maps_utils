  <!-- Small white center dot -->
  <circle cx="100" cy="72" r="5" fill="white"/>

  <!-- Crosshair lines -->
  <line x1="100" y1="48" x2="100" y2="58" stroke="#4285F4" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="86" x2="100" y2="96" stroke="#4285F4" stroke-width="3" stroke-linecap="round"/>
  <line x1="76" y1="72" x2="86" y2="72" stroke="#4285F4" stroke-width="3" stroke-linecap="round"/>
  <line x1="114" y1="72" x2="124" y2="72" stroke="#4285F4" stroke-width="3" stroke-linecap="round"/>

  <!-- Polyline route with waypoints -->
  <polyline points="48,140 72,152 100,157 128,150 154,136" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <circle cx="48" cy="140" r="4" fill="white"/>
  <circle cx="154" cy="136" r="4" fill="white"/>
</svg>
